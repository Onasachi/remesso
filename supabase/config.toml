project_id = "engaboljiqudghvzmebq"

# Local stack only (`supabase start`); the hosted project is configured in the
# dashboard. Anonymous sign-in is what binds a wallet to a session — without
# it ensureSender() fails with 422 and the whole frontend is inert.
[auth]
enable_anonymous_sign_ins = true

# ---------------------------------------------------------------------------
# Edge Functions
#
# verify_jwt defaults to true: the platform rejects any request without a valid
# Supabase JWT before the function's own code runs.
# ---------------------------------------------------------------------------

# cNGN signs deliveries with an HMAC in X-cNGN-Signature and knows nothing about
# Supabase JWTs. Left at the default, every webhook would be refused with 401 by
# the platform — and since cNGN sends each delivery exactly once with no retry,
# every redemption event would be lost permanently.
#
# The endpoint is not unauthenticated as a result: the handler verifies the HMAC
# over the raw body itself and answers 401 on a mismatch. Authentication moves
# from the platform to the signature, which is the only scheme cNGN speaks.
[functions.cngn-webhook]
verify_jwt = false

# Invoked by pg_cron through invoke_edge_function(), which sends the service
# role key from the vault. A real JWT, so platform verification stays on.
[functions.execute-due-runs]
verify_jwt = true

[functions.reconcile-redemptions]
verify_jwt = true

[functions.balance-poller]
verify_jwt = true

# Called by the Next.js route handlers with the signed-in sender's JWT. The
# function re-checks the user itself; this is the outer gate.
[functions.cngn-proxy]
verify_jwt = true

# Same arrangement as cngn-proxy: route handler -> this, with the sender's JWT.
[functions.self-verify]
verify_jwt = true

# Same reason as cngn-webhook: Self signs deliveries through Svix (svix-id,
# svix-timestamp, svix-signature) and has no Supabase JWT to send. The handler
# verifies the signature over the raw body and answers 401 on a mismatch.
[functions.self-webhook]
verify_jwt = false

# Paid triggering over x402. The caller is an agent or an app with a signed
# USDC authorisation, not a Supabase user — there is no JWT to present, and the
# payment is the authentication. The handler verifies it with Celo's hosted
# facilitator before doing anything, and refuses outright for any schedule
# whose sender did not nominate this executor as its trigger.
[functions.trigger-run]
verify_jwt = false

# The capability document. Public by design: an agent nobody can read about is
# an agent nobody can call, and it contains no secret, no sender and no
# schedule.
[functions.agent]
verify_jwt = false

# A paid capability sold to other agents. Same reasoning as trigger-run: the
# caller is an agent with a signed USDC authorisation, not a Supabase user, and
# the payment is the authentication.
[functions.rate-service]
verify_jwt = false

# An agent asking to be paid. Unauthenticated for the same reason as the rest
# of the agent surface — a caller has no Supabase JWT and should need no
# account — and free, because a toll on asking to be paid is a toll in the
# wrong place. It writes an advisory row; it cannot create a schedule.
[functions.request-payment]
verify_jwt = false

# Mirrors schedules created straight on the contract, so the executor can find
# them. Cron-invoked with the service role, like the other pollers — never by a
# caller from outside.
[functions.sync-schedules]
verify_jwt = true

# Paid LatAm services sold to other agents (2026-10-11). Same reasoning as
# rate-service: the caller pays with a signed authorisation, not a Supabase JWT.
[functions.latam-rate]
verify_jwt = false

[functions.latam-route]
verify_jwt = false

# Phase 0 of the agent-to-agent plan: samples Celo's safe and finalized heads
# every minute for two days. Cron-invoked with the service role, like the other
# pollers.
[functions.measure-finality]
verify_jwt = true

# Phase 3: the chain's payment events. index-events is cron-invoked with the
# service role, like the other pollers. payment-events serves free reads of
# them by address: what anyone can already read on-chain, so no JWT.
[functions.index-events]
verify_jwt = true

[functions.payment-events]
verify_jwt = false

# Phase 3 webhooks. Subscribing is signed by the receiving wallet (EIP-712),
# not a Supabase JWT, like request-payment's decline. The worker is
# cron-invoked with the service role.
[functions.webhooks]
verify_jwt = false

[functions.deliver-webhooks]
verify_jwt = true
